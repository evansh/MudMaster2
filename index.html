<style>
*{box-sizing:border-box}body{margin:0;background:#192821;color:ivory;font:600 16px system-ui;overflow:hidden;touch-action:none;user-select:none}canvas{display:block;width:100vw;height:100vh;height:100dvh}header,footer,#dashboard,#gear{position:fixed}header{top:max(14px,env(safe-area-inset-top));left:18px;text-shadow:0 2px 6px #19251c}small{display:block;letter-spacing:.18em;font-size:10px}h1{margin:0;font:italic 900 clamp(22px,4vw,40px) system-ui;letter-spacing:-.07em}em{color:#ffba58}button,select{border:1px solid #faf5df65;color:ivory;background:#16241fe8;border-radius:12px;padding:12px;font:700 15px system-ui;touch-action:none}button:active,.on{background:#ab611d}#gear{top:15px;right:15px}footer{bottom:max(14px,env(safe-area-inset-bottom));inset-inline:14px;display:flex;justify-content:space-between;align-items:end}footer button{min-width:52px;height:62px;font-size:20px}#gas{background:#ffb554;color:#28211b}#dashboard{bottom:90px;left:16px;background:#18241ed9;padding:8px 12px;border-left:3px solid #ffb554;border-radius:4px;font-size:13px}dialog{background:#203229;color:ivory;border:1px solid #748275;border-radius:16px;max-width:min(400px,92vw);max-height:88dvh;padding:22px}dialog::backdrop{background:#0d1916a8}dialog h2{margin:4px 0}dialog p{line-height:1.5}label,select{display:block;margin:8px 0}dialog button{margin:4px}#target{font-weight:600;font-size:13px} 
</style><canvas id="view"></canvas><header><small>PINE HOLLOW OFF-ROAD PARK</small><h1>MUDMASTER <em>2</em></h1><span id="target"></span></header><button id="gear">Garage ☰</button><div id="dashboard"></div><footer><div><button data-key="left" aria-label="Steer left">◀</button> <button data-key="right" aria-label="Steer right">▶</button></div><div><button data-key="brake">Brake / R</button> <button id="gas" data-key="gas">Gas</button></div></footer>
<dialog id="garage"><small>PINE HOLLOW</small><h2>Trail garage</h2><p>Explore the hollow and collect the orange trail flags. The arrow points to the nearest undiscovered flag. Hold Brake / R to back up.</p><label for="rig">Choose your rig</label><select id="rig"><option>Copperhead pickup</option><option>Mossback crawler</option><option>Bluebird rally truck</option></select><button id="range">Low range OFF</button><button id="recover">Return to camp</button><button id="drive">Drive ▸</button></dialog>
<script>
'use strict';
const $=id=>document.getElementById(id),c=$('view'),g=c.getContext('2d'),keys={},flags=[[0,95,'Creek crossing'],[103,185,'Pine ridge'],[-112,220,'North lookout'],[-164,42,'Beaver bend'],[116,-114,'Clay pit'],[-72,-145,'South camp']];
let save={};try{save=JSON.parse(localStorage.mudmaster2||'{}')||{}}catch{}
let found=new Set(Array.isArray(save.flags)?save.flags:[]),rig=Math.min(2,Math.max(0,Number(save.rig)||0)),low=false,x=0,z=0,a=0,v=0,t=0,lean=0,w,h,F,ca,sa,cx,cz,cy,faces=[],last=0,clock=0;
const sin=Math.sin,cos=Math.cos,clamp=(n,l,r)=>Math.max(l,Math.min(r,n)), creek=X=>74+18*sin(X*.027),trail=Z=>20*sin(Z*.018);
function surface(X,Z){if(Math.abs(Z-creek(X))<7)return 2;if(Math.abs(X-trail(Z))<11||Math.hypot(X-116,Z+114)<36)return 1;return 0}
function height(X,Z){return 2.7*sin(X*.048)*cos(Z*.03)+2*sin(Z*.055)+5*sin(X*.018+Z*.021)-3*Math.exp(-Math.pow((Z-creek(X))/11,2))}
function persist(){try{localStorage.mudmaster2=JSON.stringify({rig,flags:[...found]})}catch{}}
function point(X,Y,Z){let dx=X-cx,dz=Z-cz,d=dx*sa+dz*ca;if(d<1)return null;return [w/2+(dx*ca-dz*sa)*F/d,h*.39-(Y-cy)*F/d,d]}
function poly(vertices,color){let p=vertices.map(q=>point(...q));if(p.some(q=>!q))return;faces.push([p.reduce((s,q)=>s+q[2],0)/p.length,p,color])}
function paint(){faces.sort((a,b)=>b[0]-a[0]);for(const [,p,color] of faces){g.beginPath();g.moveTo(...p[0].slice(0,2));for(let i=1;i<p.length;i++)g.lineTo(p[i][0],p[i][1]);g.closePath();g.fillStyle=color;g.fill();g.strokeStyle=color;g.lineWidth=.65;g.stroke()}faces=[]}
function hash(i,j){let n=sin(i*127.1+j*311.7)*43758.5453;return n-Math.floor(n)}
function render(){
w=c.clientWidth;h=c.clientHeight;let ratio=Math.min(devicePixelRatio,1.4);if(c.width!==Math.round(w*ratio)||c.height!==Math.round(h*ratio)){c.width=Math.round(w*ratio);c.height=Math.round(h*ratio)}g.setTransform(ratio,0,0,ratio,0,0);F=Math.min(w*.9,h*1.17);sa=sin(a);ca=cos(a);cx=x-11*sa;cz=z-11*ca;cy=height(x,z)+5.6;
let sky=g.createLinearGradient(0,0,0,h*.65);sky.addColorStop(0,'#83b4c4');sky.addColorStop(.65,'#f5dcb3');sky.addColorStop(1,'#90a085');g.fillStyle=sky;g.fillRect(0,0,w,h);
for(let k=0;k<3;k++){g.beginPath();g.moveTo(0,h);for(let i=0;i<=w+8;i+=8){let u=a+Math.atan((i-w/2)/F);g.lineTo(i,h*(.28+k*.047+.035*sin(u*9+k)+.024*sin(u*19-k)+.012*cos(u*36+k)))}g.lineTo(w,h);g.fillStyle=['#a8aba0','#869788','#647e69'][k];g.fill()}
let gx=Math.floor(cx/6),gz=Math.floor(cz/6);
for(let i=gx-26;i<=gx+26;i++)for(let j=gz-26;j<=gz+26;j++){
let X=i*6,Z=j*6,d=(X-cx)*sa+(Z-cz)*ca,side=(X-cx)*ca-(Z-cz)*sa;if(d< -4||d>145||Math.abs(side)>Math.max(d,0)*w/(2*F)+9)continue;
let s=surface(X+3,Z+3),n=hash(i,j),Y=height(X,Z),shade=Math.round(5*n+(height(X+6,Z)-Y)*2);
poly([[X,Y,Z],[X+6,height(X+6,Z),Z],[X+6,height(X+6,Z+6),Z+6],[X,height(X,Z+6),Z+6]],'hsl('+[78,30,174][s]+' '+[25,38,24][s]+'% '+([36,30,41][s]+shade)+'%)');
if(!s&&n>.75&&Math.abs(X-trail(Z))>16&&flags.every(f=>Math.hypot(f[0]-X,f[1]-Z)>9)){
let size=4+6*n,b=(dx,y)=>[X+dx*ca,Y+y,Z-dx*sa];poly([b(-.35,0),b(.35,0),b(.35,3),b(-.35,3)],'#564b36');for(let l=0;l<3;l++){let base=1+l*size*.19,r=size*(.29-.055*l);poly([b(-r,base),b(r,base),b(0,base+size*.57)],['#314c3c','#3c5942','#496649'][l])}}
}
for(let i=0;i<flags.length;i++){let [X,Z]=flags[i],Y=height(X,Z),b=(d,y)=>[X+d*ca,Y+y,Z-d*sa];poly([b(-.12,0),b(.12,0),b(.12,6),b(-.12,6)],'#ede5c9');poly([b(.12,6),b(2.8,5.4),b(.12,4.6)],found.has(i)?'#87b29a':'#ff811e')}
paint();
let base=height(x,z),pitch=(height(x+sa*2,z+ca*2)-height(x-sa*2,z-ca*2))*.25,roll=(height(x+ca,z-sa)-height(x-ca,z+sa))*.5+lean;
function box(b,y,f,W,H,L,colors){let P=(i,j,k)=>{let u=b+i*W/2,q=f+k*L/2;return [x+u*ca+q*sa,base+y+j*H+q*pitch+u*roll+.045*sin(t*14)*Math.min(1,Math.abs(v)/5),z-u*sa+q*ca]};let A=P(-1,0,-1),B=P(1,0,-1),C=P(1,0,1),D=P(-1,0,1),E=P(-1,1,-1),G=P(1,1,-1),I=P(1,1,1),J=P(-1,1,1);for(const [pts,col] of [[[A,B,G,E],0],[[B,C,I,G],1],[[D,A,E,J],1],[[E,G,I,J],2]])poly(pts,colors[col])}
let dark=['#252923','#32352f','#42443b'],body=[['#ac5129','#924222','#d97d41'],['#57643f','#485637','#82925b'],['#38617c','#345771','#628ca2']][rig];
for(let u of [-1.15,1.15])for(let q of [-1.52,1.52])box(u,.07,q,.66,1.13,1.22,dark);
box(0,.81,0,2.55,.7,4.85,body);box(0,1.52,.48,2.17,.75,1.94,['#314747','#394e4f','#758687']);box(0,2.24,.49,2.28,.13,2.05,body);box(0,1.52,-1.44,2.1,.05,1.65,dark);for(let u of [-1.14,1.14])box(u,1.5,-1.43,.22,.25,1.85,body);box(0,1.44,-2.34,2.54,.32,.2,body);box(0,.77,-2.49,2.63,.18,.23,dark);for(let u of [-1,1])box(u,1.13,-2.44,.36,.28,.1,['#e34d2c','#9d3320','#ff8752']);paint();
}
function tick(ms){let dt=Math.min((ms-last)/1000||0,.05);last=ms;if(!$('garage').open){t+=dt;let s=surface(x,z),turn=Number(!!keys.right)-Number(!!keys.left),gas=Number(!!keys.gas),brake=Number(!!keys.brake),drag=[.28,.68,1.15][s]*(rig===1?.76:1),grade=(height(x+sin(a),z+cos(a))-height(x,z));v+=((gas*(low?11:8)+(gas&&rig===2?1:0))-brake*(v>.25?19:5)-drag*v-grade*4)*dt;if(!gas&&!brake&&Math.abs(v)<.24)v=0;v=clamp(v,-5,low?8:23);a+=turn*clamp(v/5,-1,1)*dt*(rig===1?1.35:1.08);lean+=(turn*v*.005-lean)*Math.min(1,dt*6);x=clamp(x+sin(a)*v*dt,-250,250);z=clamp(z+cos(a)*v*dt,-240,320);
let near=-1,best=Infinity;flags.forEach(([X,Z],i)=>{if(found.has(i))return;let d=Math.hypot(X-x,Z-z);if(d<6){found.add(i);persist()}else if(d<best){near=i;best=d}});let dir=near<0?0:Math.atan2(flags[near][0]-x,flags[near][1]-z)-a;
$('target').textContent=near<0?'All flags found · Free roam':(['↑','↗','→','↘','↓','↙','←','↖'][(Math.round(dir/(Math.PI/4))%8+8)%8]+' '+flags[near][2]+' · '+Math.round(best)+' m');$('dashboard').textContent=Math.round(Math.abs(v)*2.237)+' mph  ·  '+['Grass','Mud','Creek'][s]+'  ·  '+(low?'4L':'4H')+'  ·  ⚑ '+found.size+'/6';if(ms-clock>=30){render();clock=ms}}requestAnimationFrame(tick)}
for(let b of document.querySelectorAll('[data-key]')){let k=b.dataset.key;b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true;b.classList.add('on')};b.onlostpointercapture=()=>{keys[k]=false;b.classList.remove('on')}}
let mapping={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'gas',ArrowDown:'brake',a:'left',d:'right',w:'gas',s:'brake'};for(let ev of ['keydown','keyup'])window.addEventListener(ev,e=>{if(mapping[e.key]&&!$('garage').open){e.preventDefault();keys[mapping[e.key]]=ev==='keydown'}});
function clearKeys(){for(let k in keys)keys[k]=false}onblur=clearKeys;document.onvisibilitychange=clearKeys;$('gear').onclick=()=>{clearKeys();$('garage').showModal()};$('drive').onclick=()=>$('garage').close();$('recover').onclick=()=>{x=z=v=a=0;$('garage').close()};$('range').onclick=()=>{low=!low;$('range').textContent='Low range '+(low?'ON':'OFF')};$('rig').selectedIndex=rig;$('rig').onchange=e=>{rig=e.target.selectedIndex;persist()};requestAnimationFrame(tick)
</script></html>
